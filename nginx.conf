server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta que no sea un archivo real cae en index.html.
    #
    # Sin esto, un F5 en cualquier pantalla que no sea la raíz devuelve 404: el
    # router vive en el cliente y nginx no conoce esas rutas.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets de Vite llevan hash en el nombre, así que son inmutables: se
    # cachean para siempre. El index.html NO — es el que apunta a los hashes
    # nuevos, y cachearlo deja al navegador pidiendo assets que ya no existen
    # después de un deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # El JWT vive en localStorage, así que un XSS lo lee. Estas cabeceras no lo
    # arreglan, pero achican la superficie mientras tanto.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
